[project]
name = "ataa_hub"
authors = [{ name = "هيفاء عبدالرزاق" }]
description = "ERPNext app for nonprofit donations, memberships and governed spending"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    # Frappe itself is installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "B017", "W191", "E101"]

[tool.ruff.lint.isort]
known-first-party = ["ataa_hub"]
known-third-party = ["frappe", "erpnext"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
