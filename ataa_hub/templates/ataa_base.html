<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}عطاء — تبرّع لمشاريع الجمعية{% endblock %}</title>
	<link rel="icon" href="/assets/ataa_hub/images/ataa-logo.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
	<link rel="stylesheet" href="/assets/ataa_hub/css/donate.css">
	{% block head %}{% endblock %}
</head>
<body>
	<header class="ataa-header">
		<div class="ataa-container ataa-header__inner">
			<a class="ataa-brand" href="/donate">
				<img src="/assets/ataa_hub/images/ataa-logo.svg" alt="" width="36" height="36">
				<span>عطاء</span>
			</a>
			<nav class="ataa-nav">
				<a href="/donate">المشاريع</a>
				<a href="/api-docs">للمطوّرين</a>
				<a href="/login">دخول الموظفين</a>
			</nav>
		</div>
	</header>

	<main class="ataa-container ataa-main">
		{% block content %}{% endblock %}
	</main>

	<footer class="ataa-footer">
		<div class="ataa-container">
			منصة عطاء — مشروع تجريبي ببيانات وهمية. الدفع يعمل على بيئة اختبار ميسّر فقط.
		</div>
	</footer>

	<script>
		window.ATAA = { csrf_token: "{{ csrf_token or '' }}" };
	</script>
	{% block script %}{% endblock %}
</body>
</html>
