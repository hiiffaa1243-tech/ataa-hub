# Local / Codespaces development environment for Ataa Hub (ERPNext v16).
#
#   cd docker
#   docker compose up -d && docker compose logs -f frappe
#
# First start ~25 minutes (toolchain + bench + ERPNext + site + setup wizard).
# Then open http://localhost:8000 (Administrator / admin). The repo is mounted live.
# All passwords here are local-only development values.

name: ataa-hub

services:
  mariadb:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ataa_local_root}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis-cache:
    image: redis:7-alpine

  redis-queue:
    image: redis:7-alpine

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/ataa_hub/docker/init.sh
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ataa_local_root}
      SITE_NAME: ${SITE_NAME:-ataa.localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-16}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
      NODE_VERSION: ${NODE_VERSION:-24}
      # Moyasar TEST keys come from the environment (Codespaces secrets), never from the repo
      MOYASAR_PUBLISHABLE_KEY: ${MOYASAR_PUBLISHABLE_KEY:-}
      MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-}
    ports:
      - "8000:8000"   # web
      - "9000:9000"   # socket.io (realtime)
    volumes:
      - ..:/workspace/ataa_hub
      # Whole home dir: keeps the bench, uv Python and nvm Node between restarts
      - bench-home:/home/frappe
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

volumes:
  mariadb-data:
  bench-home:
