name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    services:
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ataa_hub

      - name: Set up bench
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-15 --python "$(which python)" ~/frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app ataa_hub "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-host 127.0.0.1 --db-root-password root --admin-password admin test_site
          bench --site test_site install-app ataa_hub
          bench build --app ataa_hub
        env:
          CI: "Yes"

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ataa_hub
        env:
          TYPE: server
